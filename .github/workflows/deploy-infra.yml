name: Deploy Infrastructure

on:
  pull_request:
    branches: [main]
    paths: ['infra/**', '.github/workflows/deploy-infra.yml']
  push:
    branches: [main]
    paths: ['infra/**', '.github/workflows/deploy-infra.yml']
  workflow_dispatch:

# Required for OIDC login to Azure
permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  LOCATION: eastus2
  TEMPLATE: infra/main.bicep

jobs:
  # ---------------------------------------------------------------- Lint/build
  validate:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bicep lint & build
        run: |
          az bicep install
          az bicep lint --file "$TEMPLATE"
          for p in infra/parameters/*.bicepparam; do
            az bicep build-params --file "$p" --stdout > /dev/null
          done

  # ------------------------------------------------------------------ What-if
  whatif:
    name: What-If
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        environment: [dev]
    environment: ${{ matrix.environment }}-readonly
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: What-if
        run: |
          az deployment sub what-if \
            --name "whatif-${{ matrix.environment }}-${{ github.run_id }}" \
            --location "$LOCATION" \
            --template-file "$TEMPLATE" \
            --parameters "infra/parameters/${{ matrix.environment }}.bicepparam"

  # ------------------------------------------------------------------- Deploy
  deploy-dev:
    name: Deploy dev
    needs: validate
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: dev
    secrets: inherit

  deploy-test:
    name: Deploy test
    needs: deploy-dev
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: test
    secrets: inherit

  deploy-prod:
    name: Deploy prod
    needs: deploy-test
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      environment: prod
    secrets: inherit
