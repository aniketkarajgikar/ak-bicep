name: Deploy environment (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Configure required reviewers on the GitHub Environment for approval gates (esp. prod)
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        id: deploy
        run: |
          az deployment sub create \
            --name "deploy-${{ inputs.environment }}-${{ github.run_number }}" \
            --location eastus2 \
            --template-file infra/main.bicep \
            --parameters "infra/parameters/${{ inputs.environment }}.bicepparam" \
            --query properties.outputs -o json | tee outputs.json

      - name: Summary
        run: |
          echo "### Deployed \`${{ inputs.environment }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat outputs.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
